[package]
name = "llmf"
version = "0.1.0"
edition = "2024"
description = "A tiny Rust LLM filter for composable one-shot prompts"
license = "AGPL-3.0-only"
repository = "https://github.com/stark-lin/llmf"
readme = "README.md"
keywords = ["llm", "prompt", "cli", "filter", "pipeline"]
categories = ["command-line-utilities"]

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
libc = "0.2"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"

[profile.release]
lto = true
codegen-units = 1
strip = true
