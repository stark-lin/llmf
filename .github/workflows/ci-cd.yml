name: CI/CD

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  quality:
    name: Format and lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust with quality components
        run: |
          rustup update stable --no-self-update
          rustup default stable
          rustup component add rustfmt clippy

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

  build_and_test:
    name: Test and build (${{ matrix.target }})
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - runner: macos-15-intel
            target: x86_64-apple-darwin
          - runner: macos-15
            target: aarch64-apple-darwin
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable

      - name: Verify runner target
        shell: bash
        run: |
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          test "$actual_target" = "${{ matrix.target }}"

      - name: Run tests
        run: cargo test --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Package binary and checksum
        shell: bash
        run: |
          archive="llmf-${{ matrix.target }}.tar.gz"
          tar -czf "$archive" -C target/release llmf
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ matrix.target }}
          path: |
            llmf-${{ matrix.target }}.tar.gz
            llmf-${{ matrix.target }}.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

  ci_passed:
    name: CI passed
    if: always()
    needs:
      - quality
      - build_and_test
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Verify required jobs passed
        shell: bash
        run: |
          test "${{ needs.quality.result }}" = "success"
          test "${{ needs.build_and_test.result }}" = "success"

  publish_main:
    name: Publish main snapshot
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.ci_passed.result == 'success'
    needs:
      - build_and_test
      - ci_passed
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: release
          merge-multiple: true

      - name: Update rolling GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="main-latest"
          short_sha="${GITHUB_SHA:0:7}"
          title="llmf main snapshot ($short_sha)"
          notes="$(printf 'Automated prerelease from the latest successful main build.\n\nCommit: %s\nWorkflow run: %s/%s/actions/runs/%s' "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID")"

          git fetch --no-tags origin main
          current_main="$(git rev-parse FETCH_HEAD)"
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "Skipping stale build $GITHUB_SHA; main is now $current_main."
            exit 0
          fi

          git tag --force "$tag" "$GITHUB_SHA"
          git push --force origin "refs/tags/$tag"

          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" release/* --clobber
            gh release edit "$tag" \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          else
            gh release create "$tag" release/* \
              --verify-tag \
              --title "$title" \
              --notes "$notes" \
              --prerelease \
              --latest=false
          fi
